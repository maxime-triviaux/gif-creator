# Sert l'app web sous /app/. Sur le serveur, Traefik envoie /app ici et tout le reste à l'API,
# sur le même domaine : la page appelle l'API sans CORS.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    # Redirections relatives : derrière Traefik, nginx ne connaît pas l'adresse publique
    absolute_redirect off;

    # Développement uniquement (docker-compose.dev.yml) : relaie les chemins de l'API vers une API
    # lancée sur le poste. Vide sur le serveur.
    include /etc/nginx/api-proxy/*.conf;

    location = /app {
        return 301 /app/;
    }

    location /app/ {
        index index.html;
        try_files $uri $uri/ =404;
        # Petits fichiers, toujours revalidés (ETag) : une nouvelle version est vue au lancement suivant
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /app/manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        return 404;
    }
}
